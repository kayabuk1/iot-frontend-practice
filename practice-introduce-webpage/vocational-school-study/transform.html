<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        :root {
            --rotate: 0;
            --skew-x: 0;
            --skew-y: 0;
            --scale-x: 1;
            --scale-y: 1;
            --translate-x: 0;
            --translate-y: 0;
        }

        section {
            display: grid;
            grid-template-columns: repeat(2, max-content) 1fr;
        }

        h1 {
            grid-area: auto / span 2;
            margin: 1em 0 0;
            font-size: 1.2rem;
        }

        input {
            grid-area: auto / 1;
            margin-left: 1em;
        }

        label {
            grid-area: auto / 2;
        }
        
        .transform {
            grid-area: 1 / 3 / span 50;
            border: 1px solid #000;
            margin-left: 1em;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        figure {
            background: #ff9;
            text-align: center;
            margin: 0;
            width: max-content;
            transition: all 0.5s;
        }

        img {
            height: 100px;
        }

        #origin1:checked ~ .transform > figure {
            transform-origin: center center;
        }
        
        #origin2:checked ~ .transform > figure {
            transform-origin: top left;
        }
        
        #origin3:checked ~ .transform > figure {
            transform-origin: top right;
        }
        
        #origin4:checked ~ .transform > figure {
            transform-origin: bottom left;
        }
        
        #origin4:checked ~ .transform > figure {
            transform-origin: bottom right;
        }

        #order1:checked ~ .transform > figure {
            transform:
                translateX(var(--translate-x))
                translateY(var(--translate-y))
                scaleX(var(--scale-x))
                scaleY(var(--scale-y))
                skewX(var(--skew-x))
                skewY(var(--skew-y))
                rotate(var(--rotate));
        }

        #order2:checked ~ .transform > figure {
            transform:
                rotate(var(--rotate))
                skewX(var(--skew-x))
                skewY(var(--skew-y))
                scaleX(var(--scale-x))
                scaleY(var(--scale-y))
                translateX(var(--translate-x))
                translateY(var(--translate-y));
        }

        #rotate-deg:checked ~ .transform > figure {
            --rotate: 45deg;
        }

        #rotate-turn:checked ~ .transform > figure {
            --rotate: -0.25turn;
        }

        #skew-x:checked ~ .transform > figure {
            --skew-x: 30deg;
        }

        #skew-y:checked ~ .transform > figure {
            --skew-y: -15deg;
        }

        #scale-x:checked ~ .transform > figure {
            --scale-x: 1.5;
        }
        
        #scale-y:checked ~ .transform > figure {
            --scale-y: 0.5;
        }

        #translate-x:checked ~ .transform > figure {
            --translate-x: 40px;
        }

        #translate-y:checked ~ .transform > figure {
            --translate-y: -100%;
        }
    </style>
</head>

<body>
    <section>
        <h1>基準</h1>
        <input type="radio" name="origin" id="origin1" checked>
        <label for="origin1">中央</label>
        <input type="radio" name="origin" id="origin2">
        <label for="origin2">左上</label>
        <input type="radio" name="origin" id="origin3">
        <label for="origin3">右上</label>
        <input type="radio" name="origin" id="origin4">
        <label for="origin4">左下</label>
        <input type="radio" name="origin" id="origin5">
        <label for="origin5">右下</label>
        <h1>適用順</h1>
        <input type="radio" name="order" id="order1" checked>
        <label for="order1">移動←変倍←変形←回転</label>
        <input type="radio" name="order" id="order2">
        <label for="order2">回転←変形←変倍←移動</label>
        <h1>変換の種類</h1>
        <input type="radio" name="rotate" id="rotate-zero" checked>
        <label for="rotate-zero">回転：rotate(0)</label>
        <input type="radio" name="rotate" id="rotate-deg">
        <label for="rotate-deg">回転：rotate(45deg)</label>
        <input type="radio" name="rotate" id="rotate-turn">
        <label for="rotate-turn">回転：rotate(-0.25turn)</label>
        <input type="checkbox" id="skew-x">
        <label for="skew-x">変形：skewX(30deg)</label>
        <input type="checkbox" id="skew-y">
        <label for="skew-y">変形：skewY(-15deg)</label>
        <input type="checkbox" id="scale-x">
        <label for="scale-x">変倍：scaleX(1.5)</label>
        <input type="checkbox" id="scale-y">
        <label for="scale-y">変倍：scaleY(0.5)</label>
        <input type="checkbox" id="translate-x">
        <label for="translate-x">移動：translateX(40px)</label>
        <input type="checkbox" id="translate-y">
        <label for="translate-y">移動：translateY(-100%)</label>
        <div class="transform">
            <figure>
                <img src="images/chiibakun.png" alt="チーバくん">
                <figcaption>チーバくん</figcaption>
            </figure>
        </div>
    </section>
</body>

</html>
